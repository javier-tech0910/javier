{% extends 'base.html' %}{% block title %}Actividad · VIBRA{% endblock %}{% block content %}<section class="page-card narrow"><div class="page-title"><span class="eyebrow">ACTIVIDAD</span><h1>Lo que pasa en tu VIBRA</h1></div>{% for n in notificaciones %}<div class="notification"><span class="notification-dot"></span><div><strong>{{n.nombre or 'Alguien'}}</strong> {{n.texto}}<small>{{n.fecha.strftime('%d/%m/%Y %H:%M')}}</small></div></div>{% else %}<div class="empty-card"><h2>Aún no hay actividad.</h2></div>{% endfor %}</section>{% endblock %}
