{% extends 'base.html' %}{% block title %}Editar perfil · VIBRA{% endblock %}{% block content %}<section class="page-card narrow"><div class="page-title"><span class="eyebrow">IDENTIDAD</span><h1>Editar perfil</h1></div><form class="form-grid" method="post" enctype="multipart/form-data"><label>Nombre<input name="nombre" value="{{usuario.nombre}}" required></label><label>Usuario<input name="username" value="{{usuario.username or ''}}" required></label><label>Descripción<textarea name="descripcion" maxlength="255">{{usuario.descripcion or ''}}</textarea></label><label>Enlace para apoyar<input name="link_apoyo" value="{{usuario.link_apoyo or ''}}" placeholder="https://..."> <small>Si no tienes Mercado Pago integrado, puedes poner un enlace externo.</small></label><label>Foto de perfil<input type="file" name="foto_perfil" accept="image/*"></label><label>Portada<input type="file" name="foto_portada" accept="image/*"></label><button class="red-btn">Guardar cambios</button></form></section>{% endblock %}
